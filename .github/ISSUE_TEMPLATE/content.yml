name: Content error
description: A typo, a wrong explanation, a broken exercise or a translation problem.
labels: [content]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL of the lesson or exercise.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Quote the passage if you can, and suggest a correction.
    validations:
      required: true
