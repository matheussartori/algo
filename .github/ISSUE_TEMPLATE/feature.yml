name: Topic or feature request
description: Suggest a new algorithm, exercise or feature.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help learners?
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to write it myself
