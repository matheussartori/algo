name: Bug report
description: Something in the site, the player or the exercises does not work.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, macOS 15
